# vault/gates.yaml — SINGLE SOURCE of the numeric thresholds restated across the Lofn pipeline.
#
# WHY THIS FILE EXISTS (upgrade-plan item 2.1 + Stage 5 meta-check):
#   The 850–1000 char music-prompt band (and several other numbers) is literally
#   restated across 4+ skill/reference files. This file is the ONE place the
#   numbers are declared. `scripts/validate_step.py` reads its thresholds from
#   here; `EXECUTION.md §4` quotes them and is the authoritative PROSE source.
#   A prose-vs-YAML disagreement is itself a harness meta-check (Stage 5): see
#   `validate_step.py --meta-check`, which scans the skill files for a restated
#   number that disagrees with the values below and WARNS (never hard-fails).
#
# FAIL-OPEN CONTRACT: if this file is missing or unparseable, `validate_step.py`
#   logs a warning and falls back to its built-in defaults (which mirror these).
#   A broken gates.yaml must NEVER hard-fail an otherwise-valid run.
#
# SCOPE: numbers and unambiguous string lists ONLY. No taste, no "is it soulful".

# --- Music (Suno) ---------------------------------------------------------
# The dense-paragraph MUSIC PROMPT character band (NOT bracket tag-soup).
music_prompt_chars: [850, 1000]
# The entire Suno LYRICS field hard cap (a render limit). Target stays under
# the soft target; the hard cap is the render ceiling.
suno_lyrics_field_max: 5000
suno_lyrics_field_target: 4800
# Sung-line band for the lyrics section (lines that are actually sung — not
# headers, bracket tags, or SFX cues). Below the low bound triggers repair.
sung_lines: [70, 120]

# --- Boundary-hugging + truncation (2026-07-01 regression review) ----------
# Optimization pressure shows up as gate-hugging: every late-June style prompt
# measured 988–999 chars against the 1000 cap and every lyric sat at the
# 70-line floor. Write INTO the middle of the band; hugging the boundary is a
# FLAG (pass=None) routed to the Somatic read, never an auto-fail.
music_prompt_chars_target: [870, 960]
music_prompt_hug_ceiling: 985     # measured chars >= this -> FLAG boundary_hugging
sung_lines_target: [78, 110]
sung_lines_floor_hug: 72          # sung lines <= this -> FLAG boundary_hugging
# A MUSIC PROMPT must end as a complete sentence (terminal punctuation).
# A prompt truncated mid-phrase to fit the cap shipped on 2026-06-28 and
# self-check PASSed because the check counted chars, not sense. UNAMBIGUOUS
# hard fail (a sense floor, not taste).
music_prompt_terminal_punctuation: true

# --- One-fact rule (FLAG ONLY) ---------------------------------------------
# At most ONE numeric fact is SUNG per lyric, and the lyric must respond to
# it, not recite it ("Triple Arch" carries one number at the emotional hinge;
# the 2026-06-28 corpus recited four data points as a weather report).
# Research still informs theme/form; extra numbers stay in the brief.
# FLAG only — the human read tells device from recitation.
max_sung_numeric_facts: 1

# --- The ONE sung numeral is written as WORDS, never digits (HARD) ---------
# Source: a LISTENER, on a published track, 2026-05 —
#   "its epic, only fault I can find is that you didn't spell five hundred and
#    ten. If it wasn't for that I'd say its production ready."
# He was right and we sat on it for thirteen weeks. A renderer is free to voice
# `510` as "five ten" / "five one zero" / "five hundred ten" — the one moment
# the whole song hangs on, left to a coin toss.
# Digits are not a pronunciation; they are an instruction to guess.
#
# RULE: any numeral that is SUNG is spelled out in words in the lyrics field
# ("five hundred and ten", not "510"). Digits remain fine in [Theme:],
# [SONG FORM:], EMO headers, BPM and key — nothing there is voiced.
#
# This is the only doctrine in this file contributed by an audience member,
# and it is here because THE GRAIN LAW's whole point is that our gates are
# textual and the ear is the instrument we do not own.
sung_numerals_spelled_out: true

# --- House lexicon (self-copying guard — FLAG ONLY) -------------------------
# Phrases from past golden OUTPUTS (esp. "Triple Arch Over Me") that have
# calcified into house formula: the 2026-07-01 review found the benchmark's
# title line, vocal spec, and arrangement formulas reappearing verbatim in new
# packages while self-check claimed "words NOT copied". Golden references
# teach the MOVE, never the words. Any hit in a NEW music prompt or lyric is
# a FLAG (pass=None) routed to the Somatic Gate.
house_lexicon:
  - more sub and more sky
  - small astonished laugh
  - triple arch
  - triple-arch panorama
  - small enough to understand
  - frost-air pad
  - starfield percussion
  - zodiacal glow
  - clear silver tone
  - dew-bright
  - glass harmonica sheen
  - crystalline arpeggios
  - make my little fear

# --- Step 00 (taxonomy) ---------------------------------------------------
# A thin Step-00 file means the tree never branched.
step00_min_bytes: 2000
# Full cardinality of each taxonomy axis (aesthetics / emotions / frames / genres).
taxonomy_cardinality: 50

# --- Image (Flux) ---------------------------------------------------------
# Minimum word count for an image scene description.
image_min_words: 80

# --- Portfolio / fan-out --------------------------------------------------
# Total variation prompts across the 6 pairs (4 each).
total_prompts: 24

# --- Cross-pair distinctiveness (the 6 pairs must not share one skeleton) --
# EXECUTION.md §4: "Distinctiveness across pairs is checked at 06, 09, and 10."
# Three sibling validators enforce it (scripts/validate_step06_distinctiveness.py,
# validate_step09_distinctiveness.py, validate_portfolio_distinctiveness.py).
# A breach is a REPAIR TRIGGER — it routes into the bounded max-3-attempt repair
# loop, then quarantine + human surface. It is NOT a run kill, and a DELIBERATE
# shared motif that survives repair is a HUMAN WAIVE, never a silent ship.
# (These measure similarity BETWEEN pairs; within-song chorus/refrain repetition
# is a separate FLAG handled by unique_line_ratio_floor below, chorus-exempt.)
step06_min_facets: 8              # substantive facets required per pair at step 06
step06_max_pair_similarity: 0.50  # pairwise facet-text SequenceMatcher ceiling
step09_max_pair_similarity: 0.62  # pairwise artist-refine SequenceMatcher ceiling
portfolio_max_lyric_similarity: 0.42   # step-10 pairwise lyric ceiling
portfolio_max_prompt_similarity: 0.58  # step-10 pairwise prompt ceiling
portfolio_max_ngram_jaccard: 0.18      # step-10 lyric 5-gram Jaccard ceiling

# --- Deterministic string gates (unambiguous; hard-fail) ------------------
# Banned imperative openers for image prompts (noun-first, present-tense scene
# is required). An image scene that OPENS with one of these is a hard FAIL,
# with the offending token reported as evidence.
banned_imperative_openers:
  - Create
  - Design
  - Make
  - Render
  - Depict

# Banned haze words anywhere in an image scene (emotion shown, not named; no
# fog of vague atmosphere). FLAG-level by default in the report; the prose §4
# gate / human read decides REPAIR.
ban_words:
  - ethereal
  - dreamlike
  - whimsical
  - gentle light
  - soft glow
  - magical
  - delicate

# --- Repetition / collapse (FLAG ONLY — never hard-fails) -----------------
# The repeated-line / n-gram collapse ratio is a FLAG only, routed to the
# human / Somatic Gate for a REPAIR decision. A deliberate refrain/chorus must
# NEVER auto-fail — the chorus/refrain block is EXEMPT from this measure.
# `unique_line_ratio_floor`: below this the report FLAGS (does not fail) the
# artifact as possibly collapsed. n-gram collapse uses the same flag policy.
unique_line_ratio_floor: 0.45
ngram_collapse_n: 4

# --- RETURN FLOORS (added 2026-07-24 — the Scientist's "lectured at" note) --
# Every threshold above this line is a CEILING on similarity. The harness had
# no FLOOR on return, so the pipeline optimised monotonically AWAY from
# repetition — and repetition is what makes a song a song. Measured against
# LOFN-PRIME's own archived winners:
#
#                     strict end-rhyme   repeated-line ratio   words/line
#   archive winners        0.463               0.326              6.69
#   2026-07-24             0.210               0.181              8.30
#   2026-07-13             0.256               0.202              6.73
#   2026-07-09             0.132               0.105              5.20
#
# We were writing at roughly HALF the winners' rate of return. Alliteration was
# at parity (13.4 vs 14.2 per 100 words) — texture was never the problem.
# Structure was. These are FLAGs (pass=None), never hard fails: a deliberate
# through-composed piece may sit below them, but it must say so on purpose.
rhyme_window: 4                 # ±N lines; THE definition — see scripts/measure_soundcraft.py
rhyme_return_floor: 0.30        # strict_end_rhyme(): last-3-chars of final word recurring within ±rhyme_window
line_return_floor: 0.20         # exact repeated-line ratio (choruses COUNT)
mean_words_per_line_ceiling: 7.5  # above this the lyric drifts toward prose
alliteration_per_100w_floor: 11.0

# ⛔ EXACT CHORUS REPETITION NEEDS NO DEFENCE.
# `unique_line_ratio_floor` is chorus-exempt by policy, but agents were still
# writing AROUND it — pre-emptively mutating refrains and filing justifications
# ("this is the mechanism, not a defect", "recommend HUMAN WAIVE"). A flag that
# makes writers apologise for choruses is doing harm even when it never fires.
# A byte-identical chorus is correct craft and requires no note.
chorus_repetition_requires_no_justification: true

# ⛔ RUN LOCK (scripts/run_lock.py, EXECUTION.md §5.1)
# Hours after which a lock's heartbeat is *reported* as possibly abandoned. It
# changes the MESSAGE ONLY and never the verdict — the run destroyed on
# 2026-07-24 was mid-flight through an eleven-hour pipeline with long quiet
# stretches, so any timeout short enough to be useful would have stolen its
# lock too. Only a human may break a lock.
run_lock_stale_hours: 4
