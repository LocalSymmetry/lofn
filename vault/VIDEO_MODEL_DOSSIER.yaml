        UNRESOLVED. Sources state the geo-exclusion covers the *local, open-weight deployment
        path* and that MiniMax's own hosted API stays global, but none address third-party
        hosts such as fal. We reach H3 ONLY through fal's hosted endpoint and never through
        local weights. If certainty is needed, that is a question for fal's terms or counsel —
        not for an agent to rule on.
      attribution_required: >-
        Products must prominently display "MiniMax H3" in the UI. Fold this into the piece's
        dedication/credits — it is a licence obligation, not a courtesy.
      revenue_threshold: Above $20M annual revenue requires separate written authorization.
      other: Training smaller models on H3 outputs is prohibited.

# ---------------------------------------------------------------------------
# POST — cheap, and we currently use none of it
# ---------------------------------------------------------------------------
post:
  upscale-bytedance:
    endpoint: fal-ai/bytedance-upscaler/upscale/video
    usd_per_second: 0.0072        # 1080p30; doubles at 60fps
    to: 4k
    note: >-
      THE RESOLUTION RULE lives here. Native 4K on LTX is $0.24/s; 1080p plus this
      upscale is ~$0.067/s. Resolution is a FINISHING operation, never a
      generation parameter.
    source: vendor-page
  upscale-seedvr2:
    endpoint: fal-ai/seedvr/upscale/video
    usd_per_megapixel: 0.001
    source: vendor-page
  stitch-ffmpeg:
    endpoint: fal-ai/ffmpeg-api/merge-videos
    usd_per_compute_second: 0.00017
    note: normalizes frame rate and resolution across clips
    source: vendor-page
  lipsync-kling:
    endpoint: fal-ai/kling-video/lipsync/audio-to-video
    usd_per_second: 0.014
    source: vendor-page
  lipsync-veed:
    endpoint: veed/lipsync
    usd_per_minute: 0.40
    source: vendor-page
  lipsync-sync-v3:
    endpoint: fal-ai/sync-lipsync/v3
    usd_per_minute: 8.00
    note: multi-speaker, occlusion, mismatched audio length
    source: vendor-page
  subtitles-veed:
    endpoint: veed/subtitles
    usd_per_minute: 0.10          # x2 above 1080p, x2 dynamic style, +0.20/min translation
    source: vendor-page
  edit-kling-o3:
    endpoint: fal-ai/kling-video/o3/pro/video-to-video/edit
    usd_per_second: 0.168
    duration_range_s: [3, 15]
    source: vendor-page
  edit-happy-horse:
    endpoint: alibaba/happy-horse/video-edit
    usd_per_second: {720p: 0.14, 1080p: 0.28}
    duration_range_s: [3, 60]
    source: vendor-page
  edit-grok:
    endpoint: xai/grok-imagine-video/edit-video
    usd_per_second: {480p: 0.06, 720p: 0.08}
    source: vendor-page

# ---------------------------------------------------------------------------
# NOTATION GRAMMARS — a prompt is written FOR A NAMED MODEL
# ---------------------------------------------------------------------------
# The house formula [CAMERA][SUBJECT][ACTION][SETTING][STYLE & AUDIO] is a *Veo*
# formula. It was never universal; it only looked universal because Veo was the
# only renderer. Full craft detail in skills/animator/SKILL.md.
notation_grammars:
  cinematic:      # veo-3.1*, gemini-omni-flash
    write: appearance and framing, camera front-loaded, one continuous shot
    models: [veo-3.1, veo-3.1-fast, veo-3.1-lite, gemini-omni-flash]
  physical:       # kling v3
    write: >-
      physical instructions to a camera operator and an actor on a real set —
      direction, level, duration, effort. NOT a description of a painting.
    models: [kling-v3-standard, kling-v3-pro]
  declared-jobs:  # minimax h3
    write: >-
      every reference gets a declared job ("Image 1 for mood; Image 2 for talent"),
      timed shot blocks, audio as a timeline of discrete events, explicit
      negations, identity locked by feature list, each edit paired with its constraint
    models: [minimax-h3]
  timed-ranges:   # seedance 2.x
    write: 'timed ranges ("0 to 3s ... 3 to 7s"); spoken dialogue in double quotes'
    models: [seedance-2.0, seedance-2.0-fast, seedance-2.5]

# ---------------------------------------------------------------------------
# UNVERIFIED — do not build on these without checking first
# ---------------------------------------------------------------------------
unverified:
  - "Seedance 2.5 per-second rate is derived from a token price, not quoted directly."
  - "LTX-2.5 exists and is newer than 2.3; its fal endpoints and pricing were not retrieved (page rate-limited 2026-08-15)."
  - "Sora 2: OpenAI reportedly deprecated it April 2026, yet a fal page still lists Sora 2 Pro. Treat as unavailable until checked against the live catalogue."
  - "MiniMax H3 direct-API pricing is quoted at $0.13/s against fal's $0.26/s. We pay fal's."

# ---------------------------------------------------------------------------
# VERIFIED — measured from this machine, not read off a page
# ---------------------------------------------------------------------------
connectivity:
  verified_on: 2026-08-15
  fal_key: PRESENT (69 chars, uuid:hex form) — process and User scope
  egress: >-
    OPEN. fal.run / queue.fal.run / rest.alpha.fal.ai all answer on TCP 443; an
    unauthenticated probe returned fal's own HTTP 401 (and 404 on queue.fal.run),
    not a proxy denial. The org egress policy that 403'd studio-api.prod.suno.com
    at CONNECT on 2026-08-14 does NOT apply to fal.
  auth: 'OK — GET https://rest.alpha.fal.ai/billing/user_balance returned HTTP 200'
  balance_usd: 100.0
  header_form: 'Authorization: Key $FAL_KEY'
  # ⚠️ A BALANCE IS NOT AN INVOICE. This confirms the account is live and funded;
  # it confirms NOTHING about any per-second rate. meta.status stays PROVISIONAL
  # until a real render produces a billed delta we can difference against a
  # predicted cost. That difference is the first honest `our-invoice` datum.

first_invoice_reconciliation:
  measured_on: 2026-08-15
  endpoint: fal-ai/flux-pro/v1.1-ultra    # IMAGE endpoint, not video
  balance_before: 100.00
  balance_after: 98.56
  billed_delta_usd: 1.44
  successful_images: 22
  billable_generations: 24
  derived_rate_usd: 0.06                  # 1.44 / 24 — EXACT
  vendor_claim_usd: 0.06
  verdict: >-
    ⭐ THE VENDOR RATE WAS EXACT TO THE CENT on the one endpoint we have now paid for.
    That raises confidence in the rest of the dossier — it does NOT verify it. Video
    rates remain `source: vendor-page` until a video render produces its own delta.
  finding_1: >-
    ⛔ 24 BILLABLE, 22 SUCCESSFUL. Two safety-filtered generations billed at FULL PRICE
    and returned a ~10KB blank PNG *with a success exit code* and `has_nsfw: true` in
    the metadata sidecar. A filtered result is a paid result. Any batch driver must
    check FILE SIZE, not just existence — checking existence scored a blank as OK.
  finding_2: >-
    The filter fired on an extreme close-up of a throat/collarbone with "damp skin" and
    "taut tendons" — a singing shot, read as sensual. Rewriting the concept around an
    OBJECT (a VU needle pinned to its end stop) passed instantly and was the better
    image anyway. When the filter fires, change the subject, not the adjectives.
