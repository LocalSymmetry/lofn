# VIDEO_MODEL_DOSSIER.yaml — the video generator price/capability table, as DATA
#
# WHY THIS IS A YAML FILE AND NOT A MARKDOWN TABLE
#   An earlier gates file had no machine reader, and every number in it could be
#   violated silently. A gate with no reader is a sentence. This file has exactly
#   one reader and it fails closed:
#
#       python3 scripts/video_cost_preflight.py --model <id> --duration <s> --count <n>
#
#   Prices span 12x per second and 35x per finished clip. A budget-blind pipeline
#   meeting that spread is how $100 disappears into one wave.
#
# ⛔ PROVENANCE IS A FIELD, NOT A FOOTNOTE
#   Every model carries `source:`. Today every single one reads `vendor-page`,
#   which means **every number below is a claim, not an invoice**. THE EVIDENCE IS
#   THE ARTIFACT: a vendor's pricing page is marketing until one of our own
#   receipts agrees with it. Flip a model to `our-invoice` ONLY after a real fal
#   invoice line has been read and `measured_on` stamped. Until then the preflight
#   prints a PROVISIONAL banner on every estimate.
#
# Compiled 2026-08-15 from the sweep in
#   output/analysis/2026-08-15_video-model-landscape.md

meta:
  compiled_on: 2026-08-15
  measured_on: null              # set on first reconciled fal invoice
  status: PROVISIONAL            # -> MEASURED when measured_on is set
  currency: USD
  note: >-
    Rates are per second of OUTPUT video unless a unit is named. Conflicting
    third-party figures exist for several models (one aggregator prices Seedance
    2.0 Fast an order of magnitude below fal's own page). Where sources conflict
    this file takes fal's own documentation, because fal is who bills us.

budget:
  account: fal
  funded_on: 2026-08-15
  funded_usd: 100.00
  # ⭐ THE CHEAPEST VEO WE HAVE IS THE ONE WE ALREADY BOUGHT.
  # Google AI Ultra credits are spendable ONLY inside Google's own surfaces (Flow, Whisk,
  # Vids, Gemini app). They confer ZERO API access — outside Flow it is metered Gemini
  # API / Vertex billing at the same rates fal charges. But inside Flow the marginal cost
  # of a Veo generation is $0.00 until the monthly credits run out:
  #   Veo 3.1 Quality = 100 credits  -> ~250 clips/month on a 25,000-credit plan
  #   Ultra-member rates: Lite 5 credits, Fast 10 credits (vs 10/20 for non-Ultra)
  # At fal's Standard rate those 250 clips would be ~$800. The catch is that Flow is a
  # BROWSER SURFACE, not an API: no scripting, no batch, manual download. So the cheapest
  # Veo is manual, and the scriptable Veo costs money. Route hand-picked hero shots through
  # Flow; route pipeline waves through fal.
  # ⚠️ Plan tier and credit allowance UNCONFIRMED for our account — verify before relying on it.
  # Kelly-style sizing: edge is unknown, so no single wave may risk the bankroll.
  wave_ceiling_usd:
    # RAISED 25.00 -> 40.00 on 2026-08-15 by The Scientist, deliberately, when the
    # $25 figure (my Kelly-ish guess) refused the five-song 15s wave at $39.00.
    # The bankroll owner sets the bankroll rule. Recorded rather than overridden:
    # a ceiling quietly raised whenever it binds is not a ceiling. Note that
    # session_ceiling_usd (50.00) still binds and leaves only ~$11 of headroom
    # after this wave — the next spend this session needs a fresh conversation.
    takes: 40.00               # N takes of the 1-3 SELECTED prompts, at the top-line model
    finish: 40.00              # the chosen take(s), at grade / longer / higher tier
    post: 3.00                 # upscale / stitch / subtitle
    draft: 12.00               # ⚠️ CONDITIONAL — see policy.draft_rung below. Not the default.
    bakeoff: 15.00             # deliberate cross-family comparison, budgeted separately
  session_ceiling_usd: 50.00   # total any one session may propose without a fresh approval

# ---------------------------------------------------------------------------
# POLICY — set by The Scientist, 2026-08-15
# ---------------------------------------------------------------------------
policy:
  top_line_only: >-
    ⭐ A BAD RENDER IS WORSE THAN NO RENDER. Cheap models are not a cheaper route to
    the same piece; they are a different, worse piece. Render ONLY at the top line.
    The saving comes from GETTING THE PROMPT RIGHT — which is what the 10-step,
    3-panel pipeline is for — not from buying weaker inference.
  why_this_beats_the_draft_ladder: >-
    The three-pass blind rule detects INCOHERENCE, not AVERAGENESS — and averageness
    is precisely the characteristic failure of a cheap tier. A draft wave would have
    been aimed at the one failure mode we have no instrument for, and would have
    passed its own gate while doing it.
  top_line_models: [minimax-h3, kling-v3-pro, veo-3.1, seedance-2.5]
  demoted_to_non_render: >-
    ltx-2.3-fast, veo-3.1-lite, kling-v3-standard, seedance-2.0* — these remain in
    the dossier for costing and comparison but are NOT render targets for shipped work.
  draft_rung: >-
    ⚠️ NOT THE DEFAULT, and impossible for the model that matters. MiniMax H3 has a
    single tier ($0.26/s), so there is no same-family cheap rung — and a cross-family
    draft measures nothing (preflight exit 4). A draft rung is permitted ONLY where the
    SAME model has a genuinely cheaper tier AND the notation is untested:
    veo-3.1-lite -> veo-3.1 (8x spread) · seedance-2.5 @480p -> @720p (2.1x).
    Everywhere else: the pipeline is the draft stage, and it is free.
  takes_not_drafts: >-
    ⭐ The pipeline removes PROMPT-caused regeneration. It cannot remove SEED-caused
    regeneration — same prompt, same model, different take. So budget N TAKES of the
    selected prompt at the top-line model, and choose among them. One sample of a
    stochastic process is not a result.
  cardinality: >-
    ⛔ PROMPTS ARE NOT RENDERS. The 6x4=24 mandate is a DIVERGENCE requirement on
    prompts and costs nothing (cf. the image rule, "24 prompts -> top 12 renders").
    The render count is a separate, budget-derived number — typically 1-3 selected
    prompts x 2-4 takes. 24 x H3 @15s would be $93.60, the whole account in one wave.

