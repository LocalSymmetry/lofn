# Lofn Creative Studio — model pricing (plan §7).
#
# User-editable. Prices drift; these are seeded from current published rates as
# of 2026-07 (per-MTok, i.e. USD per 1,000,000 tokens), input / output.
#
# Resolution is by exact model id. A model NOT listed here is treated as
# "unpriced": the budget meter counts tokens only and says so loudly — it never
# silently assumes $0. OpenRouter returns a per-request cost in its response; the
# engine PREFERS that actual when the provider reports it (these entries are the
# fallback estimate only).
#
# Poe- / OR- prefixed model names (the legacy model_defaults.yaml heritage) are
# matched with their prefix stripped where a bare entry exists; add explicit
# prefixed entries here to override.

version: 1
currency: USD
unit: per_mtok            # dollars per 1,000,000 tokens

models:
  # --- Anthropic (native `anthropic` dialect) --------------------------------
  claude-opus-4-8:      {in: 5.0,  out: 25.0}
  claude-opus-4-7:      {in: 5.0,  out: 25.0}
  claude-opus-4-6:      {in: 5.0,  out: 25.0}
  claude-sonnet-5:      {in: 3.0,  out: 15.0}   # intro 2/10 through 2026-08-31
  claude-sonnet-4-6:    {in: 3.0,  out: 15.0}
  claude-haiku-4-5:     {in: 1.0,  out: 5.0}
  claude-fable-5:       {in: 10.0, out: 50.0}

  # --- OpenAI (`openai-compat`, base https://api.openai.com/v1) ---------------
  gpt-5.4:              {in: 10.0, out: 30.0}
  gpt-5.3:              {in: 5.0,  out: 15.0}
  gpt-5.2:              {in: 2.5,  out: 10.0}
  gpt-5.1:              {in: 1.25, out: 10.0}
  gpt-5:                {in: 1.25, out: 10.0}
  gpt-5-mini:           {in: 0.25, out: 2.0}
  gpt-5-nano:           {in: 0.05, out: 0.4}
  gpt-4.1:              {in: 2.0,  out: 8.0}
  gpt-4.1-mini:         {in: 0.4,  out: 1.6}
  o4-mini:              {in: 1.1,  out: 4.4}
  o3:                   {in: 2.0,  out: 8.0}

  # --- Gemini (`gemini` native, or openai-compat endpoint) --------------------
  gemini-3.1-pro-preview:        {in: 2.5,  out: 15.0}
  gemini-3-flash-preview:        {in: 0.3,  out: 2.5}
  gemini-3.1-flash-lite-preview: {in: 0.1,  out: 0.4}
  gemini-2.5-pro:                {in: 1.25, out: 10.0}
  gemini-2.5-flash:              {in: 0.3,  out: 2.5}

  # --- OpenRouter (`openai-compat`, base https://openrouter.ai/api/v1) --------
  # Prefer the per-request cost OpenRouter reports; these are fallback estimates.
  "anthropic/claude-sonnet-4.5": {in: 3.0,  out: 15.0}
  "x-ai/grok-4":                 {in: 3.0,  out: 15.0}
