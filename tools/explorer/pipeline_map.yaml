# =============================================================================
# pipeline_map.yaml — THE manifest for the Lofn Prompt Explorer.
#
# This is the app's ONE new concept (design plan §3.2). The UI renders entirely
# FROM this file; nothing about the repo layout is hardcoded in app code.
# `scripts/verify_pipeline_map.py` checks every path here against the real tree
# (at app startup + in CI) so the map can never silently rot.
#
# Ground truth resolved 2026-07-03 (docs/explorer-ground-truth.md):
#   - CANONICAL library source = per-item YAML files (personalities/*.yaml,
#     panels/*.yaml). The monolith .yaml and *_index.{json,md} are DERIVED.
#   - No regen script existed -> scripts/regen_library.py is written by this build.
#   - `-1.yaml` twins are orphaned/un-indexed variants: SURFACED + flagged, never
#     hidden or auto-deleted. Counts are GLOBBED, never hardcoded (indexes drift).
#   - 250/254 canonical YAML round-trip byte-identical via per-file indent detect;
#     the rest fall back to raw-text editing (still byte-safe). See server/yamlio.py.
# =============================================================================
version: 1

# How the backend locates the repo root: walk up until a dir contains ALL markers.
repo_root_markers:
  - SOUL.md
  - vault/gates.yaml
  - skills/orchestration

# Path jail: the server may WRITE only to files matching these globs. Everything
# else in the repo is read-only. output/** is read-only in v1 (Run Inspector v1.5).
write_allowlist:
  - skills/**
  - vault/**
  - .claude/skills/**
  - tools/explorer/pipeline_map.yaml
  # Studio (Creative Studio v2): the studio OWNS its versioned FlowSpecs, knob
  # presets, and overlays under flows/. These are additive, git-tracked, and never
  # touch canon (plan §2 path-jail extension). output/studio/** stays engine-owned.
  - tools/explorer/flows/**

# The shared '##' section headings the step files carry (drives the editor outline).
step_outline_headings:
  - Description
  - Trigger Conditions
  - Required Inputs
  - Creative Context Inputs
  - Execution Instructions

# The CREATIVE CONTEXT slot tokens (from skills/<m>/OVERALL_PROMPT_TEMPLATE.md).
# The Step Editor presence-checks each `{token}` against the open file.
creative_context_slots:
  - input
  - seed
  - meta_prompt
  - personality
  - concept_panel
  - medium_panel
  - marketing_panel
  - flairs
  - genres_list
  - frames_list
  - image_context

# -----------------------------------------------------------------------------
# RAILS — the five swimlanes. nodes[] are the agent prompt files (Atlas nodes).
# -----------------------------------------------------------------------------
