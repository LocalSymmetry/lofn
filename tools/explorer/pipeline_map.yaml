execution_layer:
  - { id: lofn,                 skill: .claude/skills/lofn/SKILL.md,                 execution: .claude/skills/lofn/EXECUTION.md }
  - { id: lofn-daily,           skill: .claude/skills/lofn-daily/SKILL.md }
  - { id: lofn-image,           skill: .claude/skills/lofn-image/SKILL.md }
  - { id: lofn-music,           skill: .claude/skills/lofn-music/SKILL.md }
  - { id: lofn-video,           skill: .claude/skills/lofn-video/SKILL.md }
