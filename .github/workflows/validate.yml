name: Workflow validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/check_skill_mirror.py
      - run: python scripts/verify_pipeline_map.py
  optional-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: tools/explorer/web
      - run: npm run build
        working-directory: tools/explorer/web
      - run: python -m pip install pytest -r tools/pdf_augmenter/requirements.txt
      - run: python -m pytest -q tools/pdf_augmenter/tests
