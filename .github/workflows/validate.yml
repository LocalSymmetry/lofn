name: Workflow validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/check_skill_mirror.py
      - run: python scripts/verify_pipeline_map.py
