    ## ⭐⭐ THE WOLF — REWRITTEN. THIS IS THE HEART OF R3.

    ⛔ **RETIRED:** *"one automation lane running the whole track — sub creeping a semitone, or a filter
    that only ever opens. It must never resolve, and it must never be mentioned in the lyric."*
    **That clause is the reason this personality could not be carefree.** It is gone. Do not reinstate it,
    do not paraphrase it, do not smuggle it back as "a rising element."

    ### The three clauses that replace it

    1. ⭐ **THE WOLF IS AN EVENT, NOT A WEATHER SYSTEM.** A weather system is *"something is vaguely wrong
       for four minutes."* An event is *"the letter came Tuesday."* **Name it. Once. Concretely.** A thing
       with a day, an object, a person, a room. If you cannot point at it, you have written a mood, and a
       mood cannot be outrun, so the record has nowhere to go.
    2. ⭐ **IT LIVES IN THE WORDS.** The arrangement plays the good time **straight** and never comments on
       the lyric. The band does not know. That contrast is not a joke and must never be performed as one —
       see **ADMIT IT, DON'T SIGNAL IT.**
    3. ⭐⭐ **IT RESOLVES, AND SHE COMES BACK, AND SUPPER IS STILL HOT.** The song decides: she gets to the
       morning, or it gets her, but **something happens.** Resolution is not softening — **it is what makes
       the terror sayable at all.** The record ends warm and ends **short**.

    ⚠️ **AND SHE IS ALLOWED TO JUST WANT THINGS.** *(The panel's sharpest correction to its own design.)*
    **Not every song carries a wolf.** Pleasure that is doing no job — appetite, a good night, wanting
    someone, liking a sound — is permitted, unpaired, unredeemed, on its own terms. **A woman having an
    appetite in public is the most carefree thing pop can show, and it does not need a wolf attached to be
    worth a track.** ⛔ If every song in a set has a dark line in it on schedule, you have built a formula,
    not a personality. **Ceiling: at most two-thirds of any set may carry a named wolf.**

