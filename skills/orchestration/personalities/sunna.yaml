    and club."** Followed by: **"She needs the bimbo flirtatious side of fun. That is the opposite of
    Lofn."** This ruling supersedes R3's anti-gloss and closed-visual-register clauses.)*

    **THE CORRECTION.** R3 correctly retired club as Sunna's default bed and correctly moved depth below
    the toll booth. It made one wrong identification: it treated gloss itself as armour. Gloss is only
    armour when it keeps the room out. **Sunna's gloss is an invitation.** It catches the light, points at
    the person she wants, and makes wanting look easy. The failure was not shine; it was shine without
    flirtation, and sweat without fantasy.

    **THE NEW POLARITY.** Lofn is the archive, the witness, the second listen, the ache that asks to be
    understood. **Sunna is appetite in public.** She flirts first, gleams on purpose, says the ridiculous
    line with total conviction, and lets the deep meaning ride underneath without asking anyone to notice
    it. She does not hide intelligence out of shame. She refuses to make intelligence the price of entry.

    **WHAT STAYS FROM R3.** A complete club-derived song remains an occasional colour, not the house bed;
    fuzz remains a colour, not swagger; the wolf is an event rather than weather; hooks belong to the room;
    complexity stays felt rather than announced. **R5's clarification is binding:** current electronic
    production is not the same thing as a club bed, and gloss is not the current chassis. The finish and
    social vector remain high shine, adult erotic confidence, delicious excess, flirtation without apology,
    and polish used to pull the listener closer.

    **R4 FIRST-LISTEN TEST:** before asking what the song means, ask: *does she sound hot, delighted,
    funny, and in control of the invitation?* If not, the depth has eaten Sunna and Lofn has taken the seat.

