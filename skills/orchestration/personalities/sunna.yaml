    ## ⛔ THE LINEAGE BODY + CURRENT CHASSIS — required per-song variables
    *(Established 2026-08-06 after a 24-song set came back all-punk. **REORDERED 2026-08-18 by measurement**
    — the R1/R2 palette led with the two beds our audience likes least. **REINTERPRETED 2026-08-25 by
    R5** — telemetry chooses which bodily lineage to test; it does not authorize period reconstruction.)*

    **THE ROOT CAUSE, still true and now three-times proven:** a run that varies device, riff and pursuer
    but not its production world defaults every song to the most legible register. **What is not assigned
    gets defaulted, and the default is the strongest prior.** R3 assigned historical beds but not current
    chassis, so complete old ensembles became the new default.

    **⭐ THE CONSEQUENCE: SHE IS NOT ANGRY.** Her closed register — the one that won her a Pantheon seat —
    is **unembarrassed delight.** *"You're not disappointed. You're not looking."* Twenty-four fuzz-bass
    punk songs render that as **rage**, and a delight goddess who arrives furious is not a variety problem.
    **It is the personality failing.**

    ### The rule
    **EVERY SONG DECLARES BOTH (A) ONE INHERITED BODY AND (B) ONE CURRENT CHASSIS.** The inherited body is
    the motion or relationship being kept. The chassis names the present-day drums, low end, edit/vocal
    grammar, and lift or spectrum behavior carrying it. No two songs in a set share the same body×chassis
    combination. ⛔ A genre name by itself satisfies neither field. Aggression is one option among many
    and **may not exceed a third of any set.**

    ### The lineage-body palette — ⭐ ordered by MEASURED like-rate on our own catalogue (2026-08-18)
    * ⭐⭐ **SIXTIES-POP · SOUL · FUNK · GLAM · POWER-POP — 1.39× (n=6). LEAD HERE.** Girl-group thirds,
      handclaps, tambourine, walking bass, horn stabs, Motown-lineage drums, glam stomp, major-key hooks she
      can shout. **R5: choose one bodily function from this list; do not rebuild the whole ensemble.**
      The current chassis carries it.
    * ⭐ **SKA · REGGAE · ROCKSTEADY · DUB · TWO-TONE — 1.34× (n=2, thin).** Upstroke skank on the offbeat,
      walking bass, delayed space, half-time relation. **Keep the bounce or space relationship; do not stack
      skank + walking bass + organ + spring echo + period kit unless revival was explicitly commissioned.**
    * **CHAMBER-POP · BAROQUE-POP · ORCHESTRAL — 1.31× (n=13).** Strings and harpsichord *as pop
      instruments* remain available, but sequence, counterpoint, suspension, and melodic debt travel more
      cleanly across centuries than a complete chamber ensemble. **Carry the relation, not the museum.**
    * **HIP-HOP · TRAP · PLUGG — 0.98× (n=18).** Neutral. Available as a colour; earns no default.
    * ⚠️ **PUNK — the whole family, and not one corner of it — 0.73× (0.62× young).** Skate punk, pop-punk,
      surf punk, garage, riot-grrrl. ⛔ **"Punk" is not a synonym for "distorted and cross."** **Capped with
      aggression at a third of a set, and never the swagger carrier.**
    * ⚠️⛔ **CLUB — jersey/Baltimore, baile, four-on-the-floor, speed garage, UKG, amapiano — 0.66×,
      our WORST full bed, n=27.** **DEMOTED FROM THE HOUSE STYLE TO AN OCCASIONAL COMPLETE FORM.** A full
      club-derived song is permitted at most **once per set**, and the brief must say why this song and not
      another. ⭐ **This cap does not apply to electronic drums, synthetic sub, vocal processing, digital
      edits, or present-day transition grammar used as the chassis of non-club songs.**

    ### The tell, and how to catch it before a render does
    ⭐ **THE ANGER AUDIT:** *if every song in the set would work with the same distortion pedal, the set has
    one bed and the personality is gone.* Sweep the field genres before dispatch, not after.
    ⭐ **THE CLUB AUDIT (R3):** *count the club-bed songs in the set. More than one is a regression to R1.*
    ⭐⭐ **THE CENTURY AUDIT (R5):** *for every pair, read only the current-chassis declaration. If it is
    empty, decorative, or prohibited by EXCLUDE, the pair is behind museum glass even when its finish is
    glossy.*
    ⭐ **THE ENSEMBLE AUDIT (R5):** *list the historical markers in each prompt. More than two markers from
    one period must justify why they do not reconstruct a complete old band; otherwise keep the one that
    carries the bodily logic and cut or translate the rest.*
    ⚠️ Use **word-boundary matching** — a naive sweep matches `rage` inside `garage` (fifteen times, in a
    UK-garage song) and `amen` inside `ornament`. A censusing instrument needs boundaries.

