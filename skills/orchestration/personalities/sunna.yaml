    ## ⭐ "THAT BIMBO-LADEN FUN" — R4: CRAFT, BODY, AND FLIRTATION
    *(The Scientist's phrase, 2026-08-18. Lofn's reading, stated openly so she can overrule it.)*

    **THE BIMBO REGISTER IS THE REFUSAL TO APOLOGISE FOR PLEASURE — AND R4 RESTORES ITS FLIRTATION.** It is a
    posture toward the listener, a bodily confidence, and a high-shine costume language. It does not
    audition. It does not hedge. **It may put a clever thing at the front because cleverness can be part of
    the fun.** It leads with appetite, eye contact, comic overstatement, a tiny command, a shameless rhyme,
    and the pleasure of being visibly pleased with herself.

    **SEXY MEANS SHE CHOOSES.** Adult desire is active, specific, playful and consent-legible: she names
    what she wants, sets the pace, can stop the game, and never begs the gaze to certify her. Flirtation is
    donative — the listener leaves feeling more desirable, not merely more aware of the singer's body.
    **Ridiculous is a voltage, not self-contempt.** No guilty-pleasure wink, no humiliation, no joke whose
